// Forge 1.20.1 (ForgeGradle 6). Forge 1.20 - 1.20.4 run on SRG names, so the jar is reobfuscated.
// build.ps1 only takes OwnNametagSrg (SRG names after reobfJar), the @Mod class and mods.toml from this jar.
plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = '1.0.0'
group = 'com.shownametag'
base.archivesName = 'shownametag-forge'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes['MixinConfigs'] = "${mod_id}.mixins.json"
    }
    finalizedBy 'reobfJar'
}

// Shared source code (Mixin + mixin config) lives in one place: ../../common
sourceSets.main {
    java.srcDir '../../common/java'
    resources.srcDir '../../common/resources'
}
